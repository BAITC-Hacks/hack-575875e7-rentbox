services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      RENTBOX_DATABASE_PATH: /app/state/forecasts.duckdb
    volumes:
      - forecast_state:/app/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  forecast_state:
