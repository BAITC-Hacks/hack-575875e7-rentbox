[project]
name = "rentbox-backend"
version = "0.2.0"
description = "Dashboard API for wind farm generation forecasting"
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb>=1.5,<1.6",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pandas>=2.2,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "tzdata>=2025.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.fastapi]
entrypoint = "src.api:app"
